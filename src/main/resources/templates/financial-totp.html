<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Authenticator Verification</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .icon {
            font-size: 42px;
            text-align: center;
            margin-bottom: 10px;
        }

        .title {
            text-align: center;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 24px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="card p-4">

                <div class="icon">🔐</div>

                <h3 class="title">
                    Authenticator Verification
                </h3>

                <p class="subtitle">
                    Enter the 6-digit code from your Authenticator app
                </p>

                <form th:action="@{/user/financial/verify-totp}"
                      method="post">

                    <div class="mb-3">

                        <input type="text"
                               name="code"
                               class="form-control form-control-lg text-center"
                               placeholder="Enter 6 Digit Code"
                               inputmode="numeric"
                               pattern="[0-9]{6}"
                               maxlength="6"
                               autocomplete="one-time-code"
                               required>

                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">
                        Verify
                    </button>

                </form>

                <div class="text-danger text-center mt-3"
                     th:text="${error}">
                </div>

            </div>

        </div>
    </div>
</div>

</body>
</html>
