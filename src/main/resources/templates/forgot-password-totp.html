<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Authenticator Verification</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .card {
            margin-top: 100px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .icon {
            font-size: 60px;
            text-align: center;
        }

        .title {
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
        }

        .subtitle {
            text-align: center;
            color: gray;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card p-4">

                <div class="icon">
                    🔐
                </div>

                <h3 class="title">
                    Authenticator Verification
                </h3>

                <p class="subtitle">
                    Enter the 6-digit code from your Authenticator app
                </p>

                <form th:action="@{/forgot-password/verify-totp}"
                      method="post">

                    <div class="mb-3">

                        <input type="text"
                               name="code"
                               class="form-control form-control-lg text-center"
                               placeholder="Enter 6 Digit Code"
                               inputmode="numeric"
                               pattern="[0-9]{6}"
                               maxlength="6"
                               autocomplete="one-time-code"
                               required>

                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">
                        Verify
                    </button>

                </form>

                <div class="text-danger text-center mt-3"
                     th:text="${error}">
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
