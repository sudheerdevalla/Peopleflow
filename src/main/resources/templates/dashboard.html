<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<header class="navbar">
    <div class="logo">Renowion</div>

    <div class="right-nav">
        <a href="/logout" class="logout">Logout</a>
    </div>
</header>

<!-- ================= HERO ================= -->
<section class="hero">
    <div class="hero-content">
        <h1>Good Evening 👋 <span th:text="${username}">SaiGurlinka</span></h1>
        <p>Manage your work easily</p>

        <div class="buttons">
            <a th:href="@{/user/profile}" class="btn">My Info</a>
            <a th:href="@{/user/timesheet}" class="btn">Timesheet</a>
            <a th:href="@{/user/attendance}" class="btn">Attendance</a>
			
			<!--<div th:if="${employee.role != null and employee.role.equals('MANAGER')}"
			style="display:inline;">-->
			    <a href="/admin/manager/leaves" class="btn">Approvals</a>
        </div>
    </div>
</section>

<!-- ================= WORKFLOW ================= -->
<section class="workflow fade">
    <div class="text">
        <h2>Smart Workflow</h2>
        <p>Improve productivity and manage tasks efficiently.</p>
    </div>

    <div class="image"></div>
</section>

<!-- ================= SECURE ACCESS ================= -->
<section class="secure fade">
    <div class="secure-content">
        
        <!-- GLOBAL TIME (CENTER TOP) -->
        <div class="secure-time" id="globalTime"></div>

        <h2>Secure Access</h2>
        <p>Access your data safely and securely.</p>
    </div>
</section>

<!-- ================= JS ================= -->
<script>
function updateTimes() {
    const now = new Date();

    function formatTime(zone) {
        return now.toLocaleTimeString("en-US", {
            timeZone: zone,
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    document.getElementById("globalTime").innerText =
        "India: " + formatTime("Asia/Kolkata") +
        " | USA: " + formatTime("America/New_York") +
        " | UK: " + formatTime("Europe/London") +
        " | UAE: " + formatTime("Asia/Dubai");
}

setInterval(updateTimes, 1000);
updateTimes();
</script>

</body>
</html>
