<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Dashboard</title>

<style>
	@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

	*{
	    margin:0;
	    padding:0;
	    box-sizing:border-box;
	    font-family:'Inter',sans-serif;
	}

	body{
	    background:#f5f5f7;
	    color:#1d1d1f;
	}

	/* TOPBAR */

	.topbar{
	    height:70px;
	    background:rgba(255,255,255,.85);
	    backdrop-filter:blur(20px);
	    border-bottom:1px solid #e5e7eb;
	    display:flex;
	    justify-content:space-between;
	    align-items:center;
	    padding:0 40px;
	    position:sticky;
	    top:0;
	}

	.topbar h2{
	    font-weight:800;
	    font-size:28px;
	}

	.topbar input{
	    border:none;
	    background:#f1f1f1;
	    padding:12px 18px;
	    border-radius:14px;
	}

	.logout-btn{
	    background:#111827;
	    color:white;
	    border:none;
	    border-radius:14px;
	    padding:12px 18px;
	    margin-left:10px;
	}

	/* HERO */

	.hero{
	    margin:30px;
	    border-radius:35px;
	    min-height:420px;

	    background:
	    linear-gradient(
	    rgba(0,0,0,.45),
	    rgba(0,0,0,.45)
	    ),
	    url("https://images.unsplash.com/photo-1497366811353-6870744d04b2?q=80&w=1800");

	    background-size:cover;
	    background-position:center;

	    display:flex;
	    align-items:center;

	    padding:70px;

	    box-shadow:
	    0 25px 60px rgba(0,0,0,.12);
	}

	.hero h1{
	    font-size:72px;
	    font-weight:900;
	    color:white;
	    margin-bottom:15px;
	    letter-spacing:-2px;
	}

	.hero p{
	    font-size:22px;
	    color:#e5e7eb;
	    margin-bottom:25px;
	}

	/* BUTTONS */

	.btn{
	    display:inline-block;
	    padding:14px 24px;
	    border-radius:18px;
	    text-decoration:none;

	    background:white;
	    color:#111827;

	    border:none;

	    font-weight:600;

	    margin-right:12px;

	    transition:.3s;
	}

	.btn:hover{
	    transform:translateY(-3px);
	}

	/* REMOVE OLD ORACLE LINES */

	.wave-bg{
	    display:none;
	}

	/* FEATURE CARDS */

	.cards{
	    display:grid;
	    grid-template-columns:1fr 1fr;
	    gap:25px;
	    margin:30px;
	}

	.card{
	    border-radius:30px;
	    padding:35px;
	    color:white;
	    min-height:220px;

	    font-size:24px;
	    font-weight:700;

	    box-shadow:
	    0 15px 40px rgba(0,0,0,.08);
	}

	.card1{
	    background:
	    linear-gradient(
	    135deg,
	    #111827,
	    #374151
	    );
	}

	.card2{
	    background:
	    linear-gradient(
	    135deg,
	    #2563eb,
	    #60a5fa
	    );
	}

	/* TIME CARDS */

	.time-row{
	    display:grid;
	    grid-template-columns:
	    repeat(4,1fr);

	    gap:20px;

	    margin:30px;
	}

	.time-card{

	    background:white;

	    border-radius:28px;

	    padding:30px;

	    text-align:center;

	    font-size:22px;

	    font-weight:700;

	    box-shadow:
	    0 10px 30px rgba(0,0,0,.05);

	    transition:.3s;
	}

	.time-card:hover{
	    transform:translateY(-6px);
	}

	@media(max-width:900px){

	    .hero h1{
	        font-size:46px;
	    }

	    .cards{
	        grid-template-columns:1fr;
	    }

	    .time-row{
	        grid-template-columns:1fr 1fr;
	    }
	}
</style>
</head>

<body>

<!-- ===== HEADER ===== -->
<div class="topbar">
   <h2>PeopleFlow</h2>

    <div>
        <input type="text" placeholder="Search">
        <a href="/logout">
            <button class="logout-btn">Logout</button>
        </a>
    </div>
</div>

<!-- ===== HERO ===== -->
<div class="hero">
    <h1>
        Good Evening,
        <span th:text="${employee.name}">User</span> 👋
    </h1>

	<p>
	Work smarter with attendance, timesheets,
	leave management and approvals.
	</p>

    <div>
        <a href="/user/profile" class="btn">My Information</a>
        <a href="/user/timesheet" class="btn">My Timesheet</a>
        <a href="/user/attendance" class="btn">Attendance</a>
		
    </div>
</div>

<!-- ===== ORACLE LINES ===== -->
<div class="wave-bg"></div>

<!-- ===== CARDS ===== -->
<div class="cards">
    <div class="card card1">
        📊 Weekly Performance <br>
        Track your productivity
    </div>

    <div class="card card2">
        📢 Announcements <br>
        HR updates available
    </div>
</div>

<!-- ===== TIME ===== -->
<div class="time-row">
    <div class="time-card">India<br>5:30 PM</div>
    <div class="time-card">London<br>12:00 PM</div>
    <div class="time-card">New York<br>7:00 AM</div>
    <div class="time-card">Australia<br>8:30 PM</div>
</div>

</body>
</html>
