<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Candidate</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f5f5f7;
}

.card{
    max-width:700px;
    margin:50px auto;
    border:none;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.card-header{
    background:#111827;
    color:white;
    font-size:28px;
    font-weight:700;
    text-align:center;
    border-radius:20px 20px 0 0;
}

.btn-save{
    background:#111827;
    color:white;
}
</style>

</head>
<body>

<div class="card">

<div class="card-header">
🎯 Add Candidate
</div>

<div class="card-body">

	<form th:action="@{/candidates/save}"
	      method="post"
	      enctype="multipart/form-data">
		  
<div class="mb-3">
<label>Name</label>
<input type="text" name="name" class="form-control" required>
</div>

<div class="mb-3">
<label>Email</label>
<input type="email" name="email" class="form-control" required>
</div>

<div class="mb-3">
<label>Mobile</label>
<input type="text" name="mobile" class="form-control" required>
</div>

<div class="mb-3">
<label>Position Applied</label>
<input type="text" name="positionApplied" class="form-control" required>
</div>

<div class="mb-3">
    <label>Resume</label>

    <input type="file"
           name="resume"
           class="form-control"
           accept=".pdf,.doc,.docx">
</div>

<button class="btn btn-save w-100">
Save Candidate
</button>

</form>

</div>

</div>

</body>
</html>
