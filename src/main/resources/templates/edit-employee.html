<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Employee</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .sidebar {
            height: 100vh;
            background: #343a40;
            color: white;
            padding: 20px;
        }

        .sidebar a {
            color: white;
            display: block;
            margin: 15px 0;
            text-decoration: none;
        }

        .card {
            border-radius: 15px;
        }
    </style>
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->

        <div class="col-md-2 sidebar">

            <h4>HR Portal</h4>

            <a href="/admin/dashboard">Dashboard</a>

            <a href="/admin/employees">Employees</a>

            <a href="/admin/attendance">Attendance</a>

            <a href="/logout">Logout</a>

        </div>

        <!-- Form -->

        <div class="col-md-10 p-4">

            <h2>Edit Employee</h2>

            <div class="card shadow p-4"
                 style="max-width:700px;">

                <form th:action="@{/admin/update}"
                      method="post"
                      th:object="${employee}">

                    <input type="hidden"
                           th:field="*{empId}">

                    <!-- ========================= -->
                    <!-- BASIC DETAILS -->
                    <!-- ========================= -->

                    <div class="mb-3">
                        <label>Name</label>

                        <input type="text"
                               th:field="*{name}"
                               class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Email</label>

                        <input type="email"
                               th:field="*{email}"
                               class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Joining Date</label>

                        <input type="date"
                               th:field="*{joiningDate}"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">

                        <label>Status</label>

                        <select th:field="*{status}"
                                class="form-control">

                            <option value="Active">
                                Active
                            </option>

                            <option value="Inactive">
                                Inactive
                            </option>

                        </select>
                    </div>
					
					<div class="mb-3">

					    <label>Department</label>

					    <select th:field="*{department}"
					            class="form-control">

					        <option value="IT">IT</option>

					        <option value="HR">HR</option>

					        <option value="Finance">Finance</option>

					        <option value="Admin">Admin</option>

					        <option value="Operations">Operations</option>

					    </select>

					</div>

                    <!-- ========================= -->
                    <!-- PAYROLL DETAILS -->
                    <!-- ========================= -->

                    <hr>

                    <h4>Payroll Details</h4>

                    <div class="mb-3">
                        <label>Basic Salary</label>

                        <input type="number"
                               th:field="*{basicSalary}"
                               class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>PF Number</label>

                        <input type="text"
                               th:field="*{pfNumber}"
                               class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>UAN Number</label>

                        <input type="text"
                               th:field="*{uanNumber}"
                               class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>HRA Percentage</label>

                        <input type="number"
                               th:field="*{hraPercentage}"
                               class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Bonus Percentage</label>

                        <input type="number"
                               th:field="*{bonusPercentage}"
                               class="form-control">
                    </div>
					
					<div class="mb-3">
					    <label>Travel Allowance</label>

					    <input type="number"
					           th:field="*{travelAllowance}"
					           class="form-control">
					</div>

                    <!-- ========================= -->
                    <!-- MANAGER -->
                    <!-- ========================= -->

                    <div class="form-group mt-3">

                        <label>Assign Manager</label>

						<select th:field="*{manager.empId}"
						        class="form-control">

                            <option value="">
                                Select Manager
                            </option>

                            <option th:each="mgr : ${employees}"
                                    th:value="${mgr.empId}"
                                    th:text="${mgr.name}">
                            </option>

                        </select>
                    </div>

                    <!-- ========================= -->
                    <!-- BUTTON -->
                    <!-- ========================= -->

                    <button type="submit"
                            class="btn btn-success mt-4">

                        Update Employee

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
