<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Forgot Password</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.card{
    margin-top:100px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,0.1);
}

</style>

</head>
<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card p-4">

                <h2 class="text-center mb-4">
                    Forgot Password
                </h2>

                <form th:action="@{/forgot-password}"
                      method="post">

                    <div class="mb-3">

                        <label>Email</label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               required>

                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">

                        Continue

                    </button>

                </form>

                <div class="mt-3 text-danger"
                     th:text="${error}">
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
