<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Holiday Calendar</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family:Poppins,sans-serif;
            background:#f5f7fb;
            margin:0;
            padding:0;
        }

        .container{
            width:90%;
            margin:40px auto;
        }

        .page-title{
            text-align:center;
            margin-bottom:30px;
            color:#1e293b;
        }

        .holiday-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
            gap:20px;
        }

        .holiday-card{
            background:white;
            border-radius:15px;
            padding:20px;
            box-shadow:0 4px 15px rgba(0,0,0,0.08);
            transition:0.3s;
        }

        .holiday-card:hover{
            transform:translateY(-5px);
        }

        .holiday-date{
            font-size:22px;
            font-weight:700;
            color:#2563eb;
        }

        .holiday-name{
            font-size:18px;
            margin-top:10px;
            font-weight:600;
        }

        .holiday-type{
            margin-top:8px;
            color:#64748b;
        }

        .back-btn{
            display:inline-block;
            margin-top:30px;
            padding:10px 20px;
            background:#2563eb;
            color:white;
            text-decoration:none;
            border-radius:8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1 class="page-title">
        🎉 Holiday Calendar
    </h1>

    <div class="holiday-grid">

        <div class="holiday-card"
             th:each="h : ${holidays}">

            <div class="holiday-date"
                 th:text="${h.holidayDate}">
            </div>

            <div class="holiday-name"
                 th:text="${h.holidayName}">
            </div>

            <div class="holiday-type"
                 th:text="${h.holidayType}">
            </div>

        </div>

    </div>

    <center>
        <a th:href="@{/user/dashboard}"
           class="back-btn">
            ← Back to Dashboard
        </a>
    </center>

</div>

</body>
</html>
