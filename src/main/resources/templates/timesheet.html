<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Timesheet</title>

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #f5f5f5;
        }

        /* ===== BANNER ===== */
        .banner {
            height: 200px;
            background: url('https://images.unsplash.com/photo-1506784365847-bbad939e9335') center/cover no-repeat;
            display: flex;
            align-items: center;
            padding-left: 40px;
            color: white;
        }

        .banner h1 {
            margin: 0;
            font-size: 28px;
        }

        /* HEADER */
        .header {
            background: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
        }

        h2 {
            margin: 0;
            font-weight: 600;
        }

        /* BUTTON */
        .btn {
            background: black;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn:hover {
            background: #333;
        }

        /* CONTAINER */
        .container {
            padding: 20px;
        }

        /* BOX */
        .box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* INPUT */
        input, select {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ddd;
            margin-right: 10px;
        }

        /* TABLE */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: black;
            color: white;
            padding: 10px;
            text-align: left;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        /* STATUS */
            background: black;
            color: white;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 12px;
        }

        .status-pending {
            background: #ddd;
            color: black;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 12px;
        }

        .status-rejected {
            background: #999;
            color: white;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 12px;
        }

        /* SUMMARY */
        .summary {
            display: flex;
            gap: 20px;
        }

        .card {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .card h4 {
            margin: 0;
            color: #666;
        }

        .card h2 {
            margin-top: 10px;
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .card-day {
            background: white;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .day {
            font-weight: 600;
            margin-bottom: 10px;
        }

        .leave-tag {
            background: black;
            color: white;
            padding: 3px 6px;
            font-size: 12px;
            border-radius: 4px;
        }

    </style>
</head>

<body>

<!-- ===== TOP BANNER ===== -->
<div class="banner">
    <div>
        <h1>Welcome Back, <span th:text="${employee.name}"></span></h1>
        <p>Track your weekly work</p>
    </div>
</div>

<!-- ===== HEADER ===== -->
<div class="header">
    <h2>My Timesheet</h2>

    <button class="btn" onclick="window.location.href='/user/fill-timesheet'">
        + Fill Timesheet
    </button>
</div>

<div class="container">

    <!-- APPLY LEAVE -->
    <div class="box">
        <h4>Apply Leave</h4>

        <form action="/user/apply-leave" method="post">
            <input type="date" name="date" required>

            <select name="type">
                <option value="SICK">Sick Leave</option>
                <option value="ANNUAL">Annual Leave</option>
            </select>

            <button type="submit" class="btn">Apply Leave</button>
        </form>
    </div>

    <!-- LEAVES TABLE -->
    <div class="box">
        <h4>Your Leaves</h4>

        <table>
            <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Status</th>
            </tr>

            <tr th:each="l : ${leaves}">
                <td th:text="${l.date}"></td>
                <td th:text="${l.type}"></td>
                <td>
                    <span th:if="${l.status == 'APPROVED'}" class="status-approved">Approved</span>
                    <span th:if="${l.status == 'PENDING'}" class="status-pending">Pending</span>
                    <span th:if="${l.status == 'REJECTED'}" class="status-rejected">Rejected</span>
                </td>
            </tr>
        </table>
    </div>

    <!-- SUMMARY -->
    <div class="box summary">
        <div class="card">
            <h4>Sick Leaves</h4>
            <h2 th:text="${sickLeaves}"></h2>
        </div>

        <div class="card">
            <h4>Annual Leaves</h4>
            <h2 th:text="${annualLeaves}"></h2>
        </div>
    </div>

    <!-- WEEK GRID -->
    <div class="box">
        <div class="grid">

            <div class="card-day"
                 th:each="date : ${weekDates}"
                 th:if="${date.dayOfWeek.toString() != 'SATURDAY' and date.dayOfWeek.toString() != 'SUNDAY'}">

                <div class="day" th:text="${date.dayOfWeek}"></div>

                <!-- LEAVE -->
                <div th:if="${leaveDates.contains(date)}">
                    <span class="leave-tag">On Leave</span>
                </div>

                <!-- INPUT -->
                <div th:unless="${leaveDates.contains(date)}">
                    <input type="text" placeholder="Location"
                           th:value="${weekLocation[date.dayOfWeek.toString()]}">

                    <input type="text" placeholder="Hours"
                           th:value="${weekData[date.dayOfWeek.toString()]}">
                </div>

            </div>

        </div>
    </div>

</div>

</body>
</html>
