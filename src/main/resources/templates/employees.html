<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Employees</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            margin:0;
            background:#f5f7fb;
            font-family:Arial;
        }

        /* SIDEBAR */

        .sidebar{
            position:fixed;
            width:240px;
            height:100vh;
            background:#0f172a;
            padding-top:30px;
        }

        .sidebar h2{
            color:white;
            text-align:center;
            margin-bottom:40px;
            font-weight:bold;
        }

        .sidebar a{
            display:block;
            color:#cbd5e1;
            padding:15px 30px;
            text-decoration:none;
            transition:0.3s;
        }

        .sidebar a:hover{
            background:#1e293b;
            color:white;
        }

        /* MAIN */

        .main{
            margin-left:240px;
            padding:25px;
        }

        /* BANNER */

        .banner{
            height:240px;
            border-radius:25px;
            overflow:hidden;
            position:relative;
            margin-bottom:30px;
            background:url('https://images.unsplash.com/photo-1497366811353-6870744d04b2?q=80&w=1400&auto=format&fit=crop');
            background-size:cover;
            background-position:center;
        }

        .overlay{
            position:absolute;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.65);
        }

        .banner-content{
            position:relative;
            z-index:2;
            color:white;
            padding:60px;
        }

        .banner-content h1{
            font-size:50px;
            font-weight:bold;
        }

        .banner-content p{
            font-size:18px;
        }

        /* CARD */

        .table-card{
            background:white;
            border-radius:25px;
            padding:30px;
            box-shadow:0 4px 15px rgba(0,0,0,0.05);
        }

        .top-section{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:25px;
        }

        .search-box{
            border-radius:12px;
            height:45px;
        }

        .btn-dark{
            border-radius:12px;
            padding:10px 18px;
        }

        table{
            margin-top:20px;
        }

        .badge-active{
            background:#111827;
            color:white;
            padding:8px 14px;
            border-radius:20px;
            font-size:12px;
        }

        .action-btn{
            border:none;
            padding:7px 14px;
            border-radius:10px;
            color:white;
            text-decoration:none;
            font-size:13px;
        }

        .edit-btn{
            background:#111827;
        }

        .delete-btn{
            background:#dc2626;
        }

        .location-btn{
            background:#475569;
        }

        .action-btn:hover{
            opacity:0.85;
            color:white;
        }

    </style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <h2>HR Portal</h2>

    <a href="/admin/dashboard">🏠 Dashboard</a>

    <a href="/admin/employee">👨 Employees</a>

    <a href="/admin/attendance">📅 Attendance</a>

    <a href="/admin/leaves">📝 Leaves</a>

    <a href="/logout">🚪 Logout</a>

</div>

<!-- MAIN -->

<div class="main">

    <!-- BANNER -->

    <div class="banner">

        <div class="overlay"></div>

        <div class="banner-content">

            <h1>Employee Management</h1>

            <p>
                Manage employees, payroll, attendance and organization details
            </p>

        </div>

    </div>

    <!-- TABLE CARD -->

    <div class="table-card">

        <div class="top-section">
			<div th:if="${success}"
			     class="alert alert-success">

			    <span th:text="${success}"></span>

			</div>

			<h2>Employees</h2>

			<div class="d-flex gap-3 align-items-center">

			    <a href="/admin/add-employee"
			       class="btn btn-dark">
			        + Add Employee
			    </a>

			    <form action="/admin/employees/upload"
			          method="post"
			          enctype="multipart/form-data">

			        <input type="file" name="file" required>

			        <button type="submit" class="btn btn-primary">
			            Upload Excel
			        </button>

			    </form>

			</div>

        </div>

        <!-- SEARCH -->

        <form method="get" action="/admin/employee">

            <div class="row">

                <div class="col-md-10">

                    <input type="text"
                           name="keyword"
                           class="form-control search-box"
                           placeholder="Search employee...">

                </div>

                <div class="col-md-2">

                    <button class="btn btn-dark w-100">
                        Search
                    </button>

                </div>

            </div>

        </form>

        <!-- TABLE -->

        <table class="table table-hover align-middle">

            <thead>

            <tr>

                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Salary</th>
                <th>Status</th>
                <th>Actions</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="emp : ${employees}">

                <td th:text="${emp.empId}"></td>

                <td th:text="${emp.name}"></td>

                <td th:text="${emp.email}"></td>

                <td th:text="${emp.basicSalary}"></td>

                <td>
                    <span class="badge-active">
                        Active
                    </span>
                </td>

                <td>

                    <a th:href="@{/admin/edit/{id}(id=${emp.empId})}"
                       class="action-btn edit-btn">
                        Edit
                    </a>

                    <a th:href="@{/admin/delete/{id}(id=${emp.empId})}"
                       class="action-btn delete-btn">
                        Delete
                    </a>

                    <a th:href="@{/admin/assign-location/{id}(id=${emp.empId})}"
                       class="action-btn location-btn">
                        Assign Location
                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
