<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employee Profile</title>

    <style>
        body {
            background: #f5f6fa;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .container {
            width: 85%;
            margin: 30px auto;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .field {
            padding: 10px 0;
        }

        .label {
            font-size: 12px;
            color: #666;
            margin-bottom: 3px;
        }

        .value {
            font-size: 14px;
            color: #000;
            font-weight: 500;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .title-main {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-finance {
            background: #007bff;
            color: white;
        }

        .btn-finance:hover {
            background: #0056b3;
        }

    </style>
</head>

<body>

<div class="container">

    <!-- Top Header -->
    <div class="top-bar">
        <div class="title-main">Employee Profile</div>

        <a href="/user/financial">
            <button class="btn btn-finance">My Financial</button>
        </a>
    </div>

    <!-- Employee Details -->
    <div class="card">

        <div class="header">Employee Details</div>

        <div class="grid">

            <div class="field">
                <div class="label">Name</div>
                <div class="value" th:text="${employee.name}"></div>
            </div>

            <div class="field">
                <div class="label">Email</div>
                <div class="value" th:text="${employee.email}"></div>
            </div>

            <div class="field">
                <div class="label">Employee ID</div>
                <div class="value" th:text="${employee.empId}"></div>
            </div>

            <div class="field">
                <div class="label">Department</div>
                <div class="value" th:text="${employee.department}"></div>
            </div>

            <div class="field">
                <div class="label">Role</div>
                <div class="value" th:text="${employee.role}"></div>
            </div>

            <div class="field">
                <div class="label">Location</div>
                <div class="value" th:text="${employee.location}"></div>
            </div>

            <div class="field">
                <div class="label">Status</div>
                <div class="value" th:text="${employee.status}"></div>
            </div>

            <div class="field">
                <div class="label">Experience</div>
                <div class="value" th:text="${experience}"></div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
