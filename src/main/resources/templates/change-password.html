<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password · PeopleFlow</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f8fafc, #eef2ff);
            color: #0f172a;
        }

        .card {
            width: 420px;
            max-width: 92%;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 36px;
            box-shadow: 0 12px 35px rgba(15, 23, 42, 0.08);
        }

        .logo {
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 8px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin: 0 0 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .alert {
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.95;
        }

        .note {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">PeopleFlow</div>

    <h1>Change Password</h1>

    <div class="subtitle">
        Please set a new password to continue.
    </div>

    <div class="alert" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/change-password}" method="post">

        <div class="form-group">
            <label for="newPassword">New Password</label>
            <input
                type="password"
                id="newPassword"
                name="newPassword"
                placeholder="Enter new password"
                minlength="8"
                required>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm new password"
                minlength="8"
                required>
        </div>

        <button type="submit">
            Change Password
        </button>

    </form>

    <div class="note">
        Password must contain at least 8 characters.
    </div>

</div>

</body>
</html>
