<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · PeopleFlow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Animated background elements */
        .bg-gradient-1 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.1), transparent);
            border-radius: 50%;
            top: -100px;
            left: -100px;
            animation: float 8s ease-in-out infinite;
        }

        .bg-gradient-2 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.08), transparent);
            border-radius: 50%;
            bottom: -50px;
            right: -50px;
            animation: float-reverse 10s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(40px, -40px); }
        }

        @keyframes float-reverse {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-40px, 40px); }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 0 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15),
                        0 0 1px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: white;
            font-size: 28px;
            font-weight: 700;
        }

        .login-title {
            font-size: 28px;
            font-weight: 700;
            color: #0F172A;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .login-subtitle {
            font-size: 14px;
            color: #64748B;
            font-weight: 500;
        }

        .message-container {
            margin: 20px 0;
        }

        .success-msg {
            background: #ECFDF5;
            border: 1px solid #BBF7D0;
            color: #065F46;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .success-msg::before {
            content: "✓";
            font-weight: 700;
            font-size: 16px;
        }

        .error-msg {
            background: #FEF2F2;
            border: 1px solid #FECACA;
            color: #991B1B;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .error-msg::before {
            content: "✕";
            font-weight: 700;
            font-size: 16px;
        }

        form {
            margin-top: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #1E293B;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #E2E8F0;
            border-radius: 8px;
            font-size: 14px;
            color: #0F172A;
            background: #F8FAFC;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .form-group input::placeholder {
            color: #94A3B8;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2563EB;
            background: white;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin: 20px 0 24px;
            gap: 8px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #2563EB;
        }

        .checkbox-group label {
            font-size: 13px;
            color: #64748B;
            cursor: pointer;
            margin: 0;
            font-weight: 400;
            text-transform: none;
            letter-spacing: normal;
        }

        .submit-button {
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .submit-button:hover {
            background: linear-gradient(135deg, #1D4ED8 0%, #1E40AF 100%);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
            transform: translateY(-1px);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .divider {
            text-align: center;
            margin: 24px 0;
            font-size: 13px;
            color: #CBD5E1;
            font-weight: 500;
        }

        .footer-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .footer-link {
            text-align: center;
            font-size: 13px;
        }

        .footer-link a {
            color: #2563EB;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
            border-bottom: 1px solid transparent;
        }

        .footer-link a:hover {
            color: #1D4ED8;
            border-bottom-color: #2563EB;
        }

        .register-link a,
        .forgot-password-link a {
            color: #2563EB;
            text-decoration: none;
            font-weight: 500;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
            }

            .login-title {
                font-size: 24px;
            }

            .logo-icon {
                width: 48px;
                height: 48px;
                font-size: 24px;
            }

            .form-group input {
                padding: 10px 12px;
                font-size: 16px;
            }

            .submit-button {
                padding: 11px 14px;
                font-size: 13px;
            }
        }

        @media (max-width: 768px) {
            .bg-gradient-1, .bg-gradient-2 {
                opacity: 0.5;
            }
        }

    </style>
</head>

<body>
    <!-- Animated Background -->
    <div class="bg-gradient-1"></div>
    <div class="bg-gradient-2"></div>

    <!-- Main Container -->
    <div class="container">
        <div class="login-card">

            <!-- Logo & Title -->
            <div class="logo-section">
                <div class="logo-icon">P</div>
                <h1 class="login-title">PeopleFlow</h1>
                <p class="login-subtitle">Enterprise Workforce Management</p>
            </div>

            <!-- Messages -->
            <div class="message-container" th:if="${param.logout}">
                <div class="success-msg">
                    Logged out successfully
                </div>
            </div>

            <div class="message-container" th:if="${param.error}">
                <div class="error-msg">
                    Invalid username or password
                </div>
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post">

                <!-- Email Input -->
                <div class="form-group">
                    <label for="username">Email Address</label>
                    <input 
                        type="text" 
                        id="username"
                        name="username" 
                        placeholder="you@company.com" 
                        required 
                        autocomplete="email"
                    />
                </div>

                <!-- Password Input -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password"
                        name="password" 
                        placeholder="••••••••" 
                        required 
                        autocomplete="current-password"
                    />
                </div>

                <!-- Remember Me -->
                <div class="checkbox-group">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Keep me signed in</label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-button">Sign In</button>

            </form>

            <!-- Footer Links -->
            <div class="divider">OR</div>

            <div class="footer-links">
                <div class="footer-link register-link">
                    New to PeopleFlow? 
                    <a href="/register">Create an account</a>
                </div>
                <div class="footer-link forgot-password-link">
                    <a th:href="@{/forgot-password}">Forgot your password?</a>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
