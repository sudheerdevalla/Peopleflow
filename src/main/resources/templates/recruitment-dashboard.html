<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recruitment Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .card-metric { min-height: 120px; }
        .chart-container { max-width: 700px; margin: 0 auto; }
    </style>
</head>
<body>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Recruitment Dashboard</h2>
        <a th:href="@{/candidates/list}" class="btn btn-outline-secondary">Back to Candidates</a>
    </div>

    <!-- Metrics cards -->
    <div class="row g-3 mb-4">
        <div class="col-12 col-sm-6 col-md-4">
            <div class="card card-metric shadow-sm">
                <div class="card-body">
                    <h6 class="card-title">Total Candidates</h6>
                    <h3 id="totalCandidates" class="card-text" th:text="${totalCandidates}">0</h3>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-4">
            <div class="card card-metric shadow-sm">
                <div class="card-body">
                    <h6 class="card-title">Applied Candidates</h6>
                    <h3 id="appliedCandidates" class="card-text text-primary" th:text="${appliedCandidates}">0</h3>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-4">
            <div class="card card-metric shadow-sm">
                <div class="card-body">
                    <h6 class="card-title">Shortlisted</h6>
                    <h3 id="shortlistedCandidates" class="card-text text-warning" th:text="${shortlistedCandidates}">0</h3>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-4">
            <div class="card card-metric shadow-sm">
                <div class="card-body">
                    <h6 class="card-title">Interview Scheduled</h6>
                    <h3 id="interviewScheduledCandidates" class="card-text text-info" th:text="${interviewScheduledCandidates}">0</h3>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-4">
            <div class="card card-metric shadow-sm">
                <div class="card-body">
                    <h6 class="card-title">Selected</h6>
                    <h3 id="selectedCandidates" class="card-text text-success" th:text="${selectedCandidates}">0</h3>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-4">
            <div class="card card-metric shadow-sm">
                <div class="card-body">
                    <h6 class="card-title">Rejected</h6>
                    <h3 id="rejectedCandidates" class="card-text text-danger" th:text="${rejectedCandidates}">0</h3>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-4">
            <div class="card card-metric shadow-sm">
                <div class="card-body">
                    <h6 class="card-title">Offer Sent</h6>
                    <h3 id="offerSentCandidates" class="card-text text-secondary" th:text="${offerSentCandidates}">0</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- Charts -->
    <div class="row">
        <div class="col-12 col-md-6 mb-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Candidates by Status (Pie)</h5>
                    <div class="chart-container">
                        <canvas id="pieChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-6 mb-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Candidates by Status (Bar)</h5>
                    <div class="chart-container">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <script th:inline="javascript">
    const colors = [
        '#4e79a7','#f28e2b','#e15759','#76b7b2','#59a14f','#edc949','#b07aa1','#ff9da7'
    ];

    let pieChart = null;
    let barChart = null;

    function buildCharts(labels, values, displayNamesMap) {
        const lbls = labels.map(l => displayNamesMap && displayNamesMap[l] ? displayNamesMap[l] : l);

        const pieCtx = document.getElementById('pieChart');
        if (pieCtx) {
            if (pieChart) pieChart.destroy();
            pieChart = new Chart(pieCtx, {
                type: 'pie',
                data: {
                    labels: lbls,
                    datasets: [{ data: values, backgroundColor: colors.slice(0, lbls.length) }]
                }
            });
        }

        const barCtx = document.getElementById('barChart');
        if (barCtx) {
            if (barChart) barChart.destroy();
            barChart = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: lbls,
                    datasets: [{ label: 'Candidates', data: values, backgroundColor: colors.slice(0, lbls.length) }]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
            });
        }
    }

    function updateMetricsAndCharts() {
        fetch('/recruitment/data')
            .then(r => r.json())
            .then(json => {
                const elTotal = document.getElementById('totalCandidates'); if (elTotal) elTotal.innerText = json.total;
                const elApplied = document.getElementById('appliedCandidates'); if (elApplied) elApplied.innerText = json.applied;
                const elShort = document.getElementById('shortlistedCandidates'); if (elShort) elShort.innerText = json.shortlisted;
                const elInterview = document.getElementById('interviewScheduledCandidates'); if (elInterview) elInterview.innerText = json.interviewScheduled;
                const elSelected = document.getElementById('selectedCandidates'); if (elSelected) elSelected.innerText = json.selected;
                const elRejected = document.getElementById('rejectedCandidates'); if (elRejected) elRejected.innerText = json.rejected;
                const elOffer = document.getElementById('offerSentCandidates'); if (elOffer) elOffer.innerText = json.offerSent;

                const labels = json.labels || [];
                const values = json.values || [];
                const displayNames = json.displayNames || {};

                buildCharts(labels, values, displayNames);
            })
            .catch(err => console.error('Failed to fetch recruitment data', err));
    }

    // Run on load and refresh periodically
    document.addEventListener('DOMContentLoaded', function() {
        // initial charts built from server side rendered arrays if available
        try {
            const initialLabels = /*[[${statusLabels}]]*/ [];
            const initialValues = /*[[${statusValues}]]*/ [];
            const displayNames = /*[[${statusDisplayNames}]]*/ {};
            if (Array.isArray(initialLabels) && initialLabels.length) {
                buildCharts(initialLabels, initialValues, displayNames);
            }
        } catch(e) {
            // ignore
        }

        updateMetricsAndCharts();
        setInterval(updateMetricsAndCharts, 30000); // refresh every 30s
    });
    </script>

<!-- Bootstrap JS (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
