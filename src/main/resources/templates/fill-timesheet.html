<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Fill Timesheet</title>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/css/style.css">
<style>
body {
    margin: 0;
    font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
    background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 30%),
        radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.10), transparent 24%),
        linear-gradient(135deg, #F8FAFC 0%, #EEF2FF 100%);
    color: #0F172A;
}

.header-banner {
    min-height: 230px;
    background:
        linear-gradient(135deg, rgba(15,23,42,0.84), rgba(37,99,235,0.82)),
        url('/images/leaf.png');
    display: flex;
    align-items: center;
    padding: 40px;
    color: white;
    background-size: cover;
    background-position: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 28px 80px rgba(37, 99, 235, 0.16);
}

.header-banner::before {
    content: '';
    position: absolute;
    top: -140px;
    right: -140px;
    width: 380px;
    height: 380px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.18), transparent 68%);
}

.header-banner > div {
    position: relative;
    z-index: 1;
}

.header-banner h2 {
    font-size: 38px;
    font-weight: 800;
    letter-spacing: -1px;
    margin: 0 0 10px;
}

.header-banner p {
    margin: 0;
    font-size: 15px;
    line-height: 1.8;
    color: rgba(255,255,255,0.84);
}

.container {
    max-width: 1440px;
    margin: 0 auto;
    padding: 28px 20px 36px;
}

.week-header{
    background: rgba(255,255,255,0.90);
    padding: 18px 20px;
    border-radius: 22px;
    margin-bottom: 20px;
    text-align:center;
    box-shadow: 0 12px 30px rgba(15,23,42,0.06);
    border: 1px solid rgba(226,232,240,0.92);
    backdrop-filter: blur(16px);
}

.week-header h2{
    margin:0;
    color:#111827;
    font-size: 24px;
    letter-spacing: -0.5px;
}

.timesheet-container {
    display: grid;
    grid-template-columns: repeat(7, minmax(180px, 1fr));
    gap: 16px;
    align-items: start;
    overflow-x: auto;
    padding-bottom: 8px;
}

.card {
    background: rgba(255,255,255,0.90);
    padding: 16px;
    border-radius: 22px;
    box-shadow: 0 12px 30px rgba(15,23,42,0.06);
    border: 1px solid rgba(226,232,240,0.92);
    backdrop-filter: blur(16px);
}

.day{
    font-size:15px;
    font-weight:800;
    color: #0F172A;
    margin-bottom: 6px;
}

.date{
    font-size:11px;
    color: #64748B;
    margin-bottom: 12px;
}

.label {
    font-size: 12px;
    color: #555;
    margin-bottom: 4px;
}

input,
textarea {
    width: 100%;
    padding: 10px 12px;
    font-size: 12px;
    margin-bottom: 8px;
    box-sizing: border-box;
    border: 1.5px solid #E2E8F0;
    border-radius: 12px;
    background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);
    color: #0F172A;
    transition: all 0.2s ease;
    font-family: inherit;
}

input:focus,
textarea:focus {
    outline: none;
    border-color: #2563EB;
    background: white;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10);
}

textarea{
    height: 72px;
    resize: vertical;
}

.btn-group {
    display: flex;
    gap: 10px;
    margin-top: 6px;
}

.btn-primary {
    flex: 1;
    background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
    color: white;
    border: none;
    padding: 10px 12px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 700;
    box-shadow: 0 14px 30px rgba(37, 99, 235, 0.22);
}

.btn-secondary {
    flex: 1;
    background: #F8FAFC;
    border: 1.5px solid #E2E8F0;
    padding: 10px 12px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 700;
    color: #334155;
}

.btn-primary:hover{
    transform: translateY(-1px);
    box-shadow: 0 18px 34px rgba(37, 99, 235, 0.28);
}

.btn-secondary:hover{
    background:#EFF6FF;
    border-color: #BFDBFE;
}

@media(max-width:1200px){
    .timesheet-container {
        grid-template-columns: repeat(4, minmax(220px, 1fr));
    }
}

@media(max-width:768px){

    .week-grid,
    .grid{
        grid-template-columns:1fr !important;
    }

    .day-card{
        width:100% !important;
        min-width:100% !important;
    }

    input,
    textarea,
    select{
        width:100%;
        box-sizing:border-box;
    }

    .holiday-card,
    .leave-card{
        width:100%;
    }

    .container{
        padding:18px 12px 24px;
    }

    .week-header{
        text-align:center;
        border-radius: 20px;
    }

    .timesheet-container {
        grid-template-columns: 1fr;
        overflow-x: visible;
    }

    .header-banner {
        min-height: 200px;
        padding: 28px 20px;
    }

    .header-banner h2 {
        font-size: 30px;
    }

    .card {
        border-radius: 20px;
    }
}


</style>
</head>

<body>

<!-- 🔥 Banner -->
<div class="header-banner">
    <div>
        <h2>Welcome Back</h2>
        <p>Fill your weekly timesheet</p>
    </div>
</div>

<div class="container">
	
	<div class="card" style="margin-bottom:20px;">

	    <h3>Upcoming Holidays</h3>

	    <div th:each="holiday : ${holidays}">

	        <b th:text="${holiday.holidayName}"></b>
	        -

	        <span th:text="${holiday.holidayDate}"></span>

	        <span>
	            (
	            <span th:text="${holiday.holidayType}"></span>
	            )
	        </span>

	    </div>

	</div>
	<div class="week-header">
	    <h2>
	        Week :
	        <span th:text="${weekDates[0]}"></span>
	        →
	        <span th:text="${weekDates[weekDates.size()-1]}"></span>
	    </h2>
	</div>

<div class="timesheet-container">

<div class="card" th:each="date : ${weekDates}">
	
	<!-- HOLIDAY -->
	<div th:if="${holidayMap.containsKey(date)}"
	     class="card"
	     style="
	     background:#ecfdf5;
	     border:2px solid #22c55e;
	     text-align:center;">

	    <h3 style="color:#16a34a;">
	        🎉 Holiday
	    </h3>

	    <p th:text="${holidayMap.get(date).holidayName}"></p>

	</div>
	
		<div th:if="${!holidayMap.containsKey(date) && leaveDates.contains(date)}"
		     class="card"
		     style="
		     background:#fff1f2;
		     border:2px solid #ef4444;
		     text-align:center;">

		    <h3 style="color:#dc2626;">
		        On Leave
		    </h3>

		</div>

	   <div th:unless="${holidayMap.containsKey(date) || leaveDates.contains(date)}">

<div class="day" th:text="${#temporals.format(date, 'EEEE')}"></div>
<div class="date" th:text="${date}"></div>

<form th:if="${!date.isAfter(today)}"
      th:action="@{/user/timesheet}"
      method="post">

<input type="hidden" name="date" th:value="${date}" />

<!-- LOCATION -->
<input type="text"
       name="workLocation"
       class="location-input"
       th:value="${timesheetMap.containsKey(date) && timesheetMap.get(date).workLocation != null && !timesheetMap.get(date).workLocation.isEmpty()
                  ? timesheetMap.get(date).workLocation
                  : employee.location}"
       readonly />
	   
	   <!-- CLIENT NAME -->
	   <input type="text"
	          name="clientName"
	          placeholder="Client Name">

	   <!-- PROJECT NAME -->
	   <input type="text"
	          name="projectName"
	          placeholder="Project Name">

	   <!-- WORK DESCRIPTION -->
	   <textarea
	           name="workDescription"
	           placeholder="Work Description"></textarea>

	   <!-- GPS HIDDEN FIELDS -->
	   <input type="hidden"
	          name="latitude"
	          class="latitude">

	   <input type="hidden"
	          name="longitude"
	          class="longitude">

	   <button type="button"
	           class="btn-secondary"
	           onclick="captureLocation(this)">
	       📍 Capture Location
	   </button>

<!-- HOURS -->
<input type="number"
       name="hours"
       class="hours-input"
       th:value="${timesheetMap.containsKey(date) ? timesheetMap.get(date).hours : 0}"
       placeholder="Enter hours"
       th:readonly="${date.isAfter(today)}">
      

<!-- TRAINING -->
<input type="number"
       name="training"
       class="training-input"
       th:value="${timesheetMap.containsKey(date) ? timesheetMap.get(date).training : 0}"
       placeholder="Enter training hours"
       th:readonly="${date.isAfter(today)}">
	   
	   <div th:if="${timesheetMap.containsKey(date)}">

	       <p style="font-weight:bold;">

	           Status :

	           <span th:text="${timesheetMap.get(date).status}"
	                 th:style="${timesheetMap.get(date).status == 'APPROVED'}
	                 ? 'color:green'
	                 : (${timesheetMap.get(date).status == 'LOCATION_MISMATCH'}
	                 ? 'color:red'
	                 : 'color:orange')">
	           </span>

	       </p>

	   </div>
       

<div class="btn-group">
	<button type="submit"
	        class="btn-primary"
	        th:text="${timesheetMap.containsKey(date) ? 'Update' : 'Submit'}">
	</button>

    <!-- EDIT BUTTON (focus only) -->
	<button type="button"
	        class="btn-secondary"
	        onclick="focusHours(this)"
	        th:disabled="${date.isAfter(today)}">
	    Edit
	</button>
</div>

</form>

<div th:if="${date.isAfter(today)}">

    <p style="color:red;
              font-weight:bold;
              text-align:center;">
        Future Date - Entry Not Allowed
    </p>

</div>

</div>

</div>

</div>

<!-- WEEKLY BUTTON -->

<div style="text-align:center;margin-top:25px;">

    <button
        style="
        background:#111827;
        color:white;
        border:none;
        padding:14px 35px;
        border-radius:8px;
        font-size:16px;
        font-weight:bold;">

        Submit Weekly Timesheet

    </button>

</div>

	function focusHours(btn) {

	    if(btn.disabled){
	        return;
	    }

	    let card = btn.closest('.card');

	    let hoursInput =
	        card.querySelector('.hours-input');

	    let trainingInput =
	        card.querySelector('.training-input');

	    hoursInput.removeAttribute('readonly');
	    trainingInput.removeAttribute('readonly');

	    hoursInput.focus();
	}

			        </div>

			        <div style="
			            background:#EFF6FF;
			            color:#2563EB;
			            padding:14px 22px;
			            border-radius:18px;
			            font-weight:700;">

			            <span th:text="${weekDates[0]}"></span>

			            &nbsp;

			            →

			            &nbsp;

			            <span th:text="${weekDates[weekDates.size()-1]}"></span>

			        </div>

			    </div>

			</div>

			<!-- ========================= -->
			<!-- TIMESHEET GRID -->
			<!-- ========================= -->

			<div class="timesheet-container">

			<div class="card"

			     th:each="date : ${weekDates}"

			     style="padding:22px;">

			<!-- Continue from your existing
			Holiday / Leave / Form logic exactly
			without changing any Thymeleaf attributes -->
			<!-- ========================= -->
			<!-- DAY CARD -->
			<!-- ========================= -->

			<!-- HOLIDAY -->
			<div th:if="${holidayMap.containsKey(date)}"
			     class="card"
			     style="
			        background:linear-gradient(135deg,#ECFDF5,#F0FDF4);
			        border:1px solid rgba(22,163,74,.25);
			        box-shadow:0 12px 30px rgba(22,163,74,.12);
			        text-align:center;
			        padding:28px;">

			    <div style="
			        width:68px;
			        height:68px;
			        margin:auto;
			        border-radius:50%;
			        display:flex;
			        align-items:center;
			        justify-content:center;
			        background:#DCFCE7;
			        font-size:30px;
			        margin-bottom:16px;">

			        🎉

			    </div>

			    <h3 style="
			        color:#16A34A;
			        font-size:22px;
			        margin-bottom:10px;">

			        Holiday

			    </h3>

			    <p style="
			        font-weight:700;
			        color:#0F172A;
			        margin-bottom:8px;"
			       th:text="${holidayMap.get(date).holidayName}">
			    </p>

			    <span class="badge badge-success">

			        Enjoy your holiday

			    </span>

			</div>

			<!-- LEAVE -->

			<div th:if="${!holidayMap.containsKey(date) && leaveDates.contains(date)}"
			     class="card"
			     style="
			        background:linear-gradient(135deg,#FFF1F2,#FFF7F7);
			        border:1px solid rgba(220,38,38,.20);
			        box-shadow:0 12px 30px rgba(220,38,38,.12);
			        text-align:center;
			        padding:28px;">

			    <div style="
			        width:68px;
			        height:68px;
			        margin:auto;
			        border-radius:50%;
			        display:flex;
			        align-items:center;
			        justify-content:center;
			        background:#FEE2E2;
			        font-size:30px;
			        margin-bottom:16px;">

			        🌴

			    </div>

			    <h3 style="
			        color:#DC2626;
			        font-size:22px;
			        margin-bottom:10px;">

			        On Leave

			    </h3>

			    <span class="badge badge-danger">

			        Leave Approved

			    </span>

			</div>

			<!-- WORK DAY -->

			<div th:unless="${holidayMap.containsKey(date) || leaveDates.contains(date)}">

			<div style="
			display:flex;
			justify-content:space-between;
			align-items:center;
			margin-bottom:18px;">

			<div>

			<div class="day"
			     th:text="${#temporals.format(date,'EEEE')}">
			</div>

			<div class="date"
			     th:text="${date}">
			</div>

			</div>

			<div style="
			background:#EFF6FF;
			color:#2563EB;
			padding:8px 12px;
			border-radius:999px;
			font-size:12px;
			font-weight:700;">

			Work Day

			</div>

			</div>

			<form th:if="${!date.isAfter(today)}"
			      th:action="@{/user/timesheet}"
			      method="post">

			<input type="hidden"
			       name="date"
			       th:value="${date}" />

			<!-- LOCATION -->

			<label class="label">

			Work Location

			</label>

			<input type="text"
			       name="workLocation"
			       class="location-input"
			       th:value="${timesheetMap.containsKey(date) && timesheetMap.get(date).workLocation != null && !timesheetMap.get(date).workLocation.isEmpty()
			                  ? timesheetMap.get(date).workLocation
			                  : employee.location}"
			       readonly />

			<!-- CLIENT -->

			<label class="label">

			Client

			</label>

			<input type="text"
			       name="clientName"
			       placeholder="Client Name">

			<!-- PROJECT -->

			<label class="label">

			Project

			</label>

			<input type="text"
			       name="projectName"
			       placeholder="Project Name">

			<!-- DESCRIPTION -->

			<label class="label">

			Work Description

			</label>

			<textarea
			        name="workDescription"
			        placeholder="Describe today's work...">
			</textarea>

			<input type="hidden"
			       name="latitude"
			       class="latitude">

			<input type="hidden"
			       name="longitude"
			       class="longitude">

			<button
			        type="button"
			        class="btn-secondary"
			        onclick="captureLocation(this)">

			📍 Capture Location

			</button>

			<label class="label">

			Working Hours

			</label>

			<input type="number"
			       name="hours"
			       class="hours-input"
			       th:value="${timesheetMap.containsKey(date) ? timesheetMap.get(date).hours : 0}"
			       placeholder="Enter hours"
			       th:readonly="${date.isAfter(today)}">

			<label class="label">

			Training Hours

			</label>

			<input type="number"
			       name="training"
			       class="training-input"
			       th:value="${timesheetMap.containsKey(date) ? timesheetMap.get(date).training : 0}"
			       placeholder="Enter training hours"
			       th:readonly="${date.isAfter(today)}">
			<!-- ========================= -->
			<!-- STATUS -->
			<!-- ========================= -->

			<div th:if="${timesheetMap.containsKey(date)}"
			     style="margin-top:18px;">

			    <div style="
			        display:flex;
			        justify-content:space-between;
			        align-items:center;
			        padding:14px 16px;
			        border-radius:16px;
			        background:#F8FAFC;
			        border:1px solid #E2E8F0;">

			        <span style="
			            font-size:13px;
			            font-weight:700;
			            color:#475569;">

			            Status

			        </span>

			        <span
			            th:text="${timesheetMap.get(date).status}"
			            th:style="${timesheetMap.get(date).status == 'APPROVED'}
			            ? 'background:#DCFCE7;color:#15803D;padding:8px 16px;border-radius:999px;font-weight:700;font-size:12px;'
			            : (${timesheetMap.get(date).status == 'LOCATION_MISMATCH'}
			            ? 'background:#FEE2E2;color:#B91C1C;padding:8px 16px;border-radius:999px;font-weight:700;font-size:12px;'
			            : 'background:#FEF3C7;color:#B45309;padding:8px 16px;border-radius:999px;font-weight:700;font-size:12px;')">

			        </span>

			    </div>

			</div>

			<!-- ========================= -->
			<!-- ACTION BUTTONS -->
			<!-- ========================= -->

			<div class="btn-group"
			     style="margin-top:18px;">

			    <button type="submit"
			            class="btn-primary"
			            th:text="${timesheetMap.containsKey(date) ? 'Update' : 'Submit'}">

			    </button>

			    <button type="button"
			            class="btn-secondary"
			            onclick="focusHours(this)"
			            th:disabled="${date.isAfter(today)}">

			        Edit

			    </button>

			</div>

			</form>

			<!-- ========================= -->
			<!-- FUTURE DATE -->
			<!-- ========================= -->

			<div th:if="${date.isAfter(today)}">

			    <div style="
			        padding:26px;
			        text-align:center;
			        border-radius:18px;
			        background:linear-gradient(135deg,#FEF2F2,#FFF7F7);
			        border:1px solid rgba(220,38,38,.18);">

			        <div style="
			            width:70px;
			            height:70px;
			            margin:auto;
			            margin-bottom:16px;
			            border-radius:50%;
			            display:flex;
			            align-items:center;
			            justify-content:center;
			            background:#FEE2E2;
			            font-size:32px;">

			            ⏳

			        </div>

			        <h3 style="
			            color:#DC2626;
			            margin-bottom:10px;
			            font-size:20px;">

			            Future Date

			        </h3>

			        <p style="
			            color:#64748B;
			            line-height:1.7;">

			            Timesheet entry is available only on or after this date.

			        </p>

			    </div>

			</div>

			</div>

			<!-- END WORK DAY -->

			</div>

			<!-- END DAY CARD -->

			</div>

			<!-- END GRID -->

			<!-- ========================= -->
			<!-- WEEKLY SUBMIT -->
			<!-- ========================= -->

			<div style="
			text-align:center;
			margin-top:40px;">

			    <button
			        style="
			        background:linear-gradient(135deg,#111827,#1E293B);
			        color:white;
			        border:none;
			        border-radius:18px;
			        padding:18px 45px;
			        font-size:17px;
			        font-weight:700;
			        cursor:pointer;
			        box-shadow:0 18px 40px rgba(15,23,42,.18);
			        transition:.3s;">

			        🚀 Submit Weekly Timesheet

			    </button>

			</div>
			<!-- ========================= -->
			<!-- ORIGINAL JAVASCRIPT (UNCHANGED) -->
			<!-- ========================= -->

			<script>

			function focusHours(btn) {

			    if(btn.disabled){
			        return;
			    }

			    let card = btn.closest('.card');

			    let hoursInput =
			        card.querySelector('.hours-input');

			    let trainingInput =
			        card.querySelector('.training-input');

			    hoursInput.removeAttribute('readonly');
			    trainingInput.removeAttribute('readonly');

			    hoursInput.focus();
			}

			function captureLocation(btn) {

			    let form = btn.closest('form');

			    navigator.geolocation.getCurrentPosition(

			        function(position) {

			            form.querySelector('.latitude').value =
			                position.coords.latitude;

			            form.querySelector('.longitude').value =
			                position.coords.longitude;

			            alert("Location Captured Successfully");

			        },

			        function(error) {

			            alert("Location Permission Denied");

			        }

			    );
			}

			</script>

			

</body>
</html>
