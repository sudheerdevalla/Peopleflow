<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Timesheet</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: "Segoe UI";
            background-color: #f3f2f1;
            padding: 30px;
        }

        .card {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="card">

    <h3>Edit Timesheet</h3>

    <form th:action="@{/user/update-timesheet}" method="post">

        <input type="hidden" name="id"
               th:value="${timesheet != null ? timesheet.id : ''}">

        <label>Date</label>
        <input type="date" name="date"
               th:value="${timesheet != null ? timesheet.date : ''}"
               class="form-control mb-2">

        <label>Hours</label>
        <input type="number" name="hours"
               th:value="${timesheet != null ? timesheet.hours : ''}"
               class="form-control mb-2">

        <label>Training</label>
        <input type="number" name="training"
               th:value="${timesheet != null ? timesheet.training : ''}"
               class="form-control mb-2">

        <label>Location</label>
        <input type="text" name="workLocation"
               th:value="${timesheet != null ? timesheet.workLocation : ''}"
               class="form-control mb-3">

        <button type="submit" class="btn btn-primary w-100">
            Update Timesheet
        </button>

    </form>

</div>

</body>
</html>
