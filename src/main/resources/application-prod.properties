# ===========================
# PRODUCTION PROFILE
# ===========================
# This profile is used for production deployment (e.g., Oracle Cloud)
# Contains production-specific configurations
# IMPORTANT: Do NOT enable dev endpoints in production

# Production logging - Error level only
logging.level.com.hr.hrapp=INFO
logging.level.org.springframework.web=WARN

# Hide sensitive mail logs
logging.level.org.springframework.mail=WARN

# Database - Production (via environment variables or secrets manager)
# Set via: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/peopleflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# JPA - Production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Mail - Production (Office 365 via environment variables)
spring.mail.host=${SPRING_MAIL_HOST:smtp.office365.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:connect@renwion.in}
spring.mail.password=${SPRING_MAIL_PASSWORD:password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Admin/CEO email for production
app.admin.email=${ADMIN_EMAIL:admin@example.com}

# ===========================
# FEATURE TOGGLES (PROD - ALL DISABLED)
# ===========================
# Dev mail test controller is DISABLED in production
app.features.dev-mail-tester-enabled=false

# Production server port
server.port=8443
